<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GuruAgent — Dynamic Dashboard</title>
<style>
:root {
  --bg: #F4EFE6;           /* Warm Rich Cream Background */
  --card: #FAF8F5;         /* Crisp White Cream Cards */
  --cream: #E7DFD3;        /* Soft Warm Accent Cream */
  --sb-bg: #1C1917;        /* Dark Espresso Sidebar Background */
  --sb-tx: #F5F5F4;        /* Light Cream Text for Sidebar */
  --sb-hover: #292524;     /* Dark Hover State */
  --tx: #26221F;           /* Deep Charcoal Text */
  --mu: #78716C;           /* Warm Muted Text */
  --bd: #DDD5C7;           /* Soft Warm Border */
  --ac: #D97706;           /* Warm Gold Amber Accent */
  --ac-dark: #B45309;      /* Dark Amber */
  --ok: #2E7D32;           /* Soft Green Success */
  --sh: 0 4px 16px rgba(40, 30, 20, 0.08);
  --sh-hover: 0 12px 28px rgba(180, 83, 9, 0.18);
  box-sizing: border-box;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
body { overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0 0 8px; font-weight: 700; }
p { margin: 8px 0; }
.mu { color: var(--mu); }

#app { display: flex; min-height: 100vh; }

/* Dark Espresso Collapsible Sidebar */
.sb {
  width: 240px;
  flex: none;
  background: var(--sb-bg);
  color: var(--sb-tx);
  border-right: 1px solid rgba(255,255,255,0.08);
  padding: 18px 12px;
  position: sticky;
  top: 0;
  align-self: flex-start;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  z-index: 10;
}
.sb.c { width: 72px; }
.sb.c .lb { display: none; }
.sb.c .nv { justify-content: center; padding-inline: 10px; }

.logo {
  font-weight: 800;
  font-size: 19px;
  padding: 8px 12px;
  white-space: nowrap;
  color: #FDE68A;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.2s ease;
}
.logo:hover { transform: scale(1.03); }

/* Sidebar Items - Rich Hover */
.nv {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 11px 14px;
  border-radius: 12px;
  cursor: pointer;
  white-space: nowrap;
  color: #A8A29E;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.nv:hover {
  background: var(--sb-hover);
  color: #FDE68A;
  transform: translateX(4px);
}
.nv.on {
  background: var(--ac);
  color: #FFFFFF;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
}
.nv.on:hover {
  background: var(--ac-dark);
  transform: translateX(4px) scale(1.01);
}
.nv span:first-child { width: 22px; text-align: center; font-size: 17px; }

/* Main Content Area */
.mn { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* Header Bar */
.hd {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  padding: 14px 28px;
  background: #231F1D;
  color: #FAF8F5;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: sticky;
  top: 0;
  z-index: 5;
}
.hd .btn.ghost { flex: none; }
.top-title { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.top-title small { display: block; color: #A8A29E; font-weight: 500; font-size: 11px; }
.top-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }

.pg { padding: 28px; max-width: 1120px; margin: 0 auto; width: 100%; }

/* Cards — FULL HOVER LIFT & GLOW EFFECT */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 22px;
  box-shadow: var(--sh);
  margin-bottom: 20px;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: var(--sh-hover);
  border-color: var(--ac);
}
.card.k { cursor: pointer; }
.section-action {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 14px;
  padding: 9px 14px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  background: rgba(255,255,255,.7);
  color: var(--tx);
  font-size: 13px;
  font-weight: 700;
  transition: transform .22s ease, background-color .22s ease, border-color .22s ease, box-shadow .22s ease;
}
.section-action:hover {
  transform: translateY(-2px);
  background: #FFF8EE;
  border-color: var(--ac);
  box-shadow: 0 6px 14px rgba(217,119,6,.16);
}
.section-action.amber {
  background: var(--ac);
  border-color: var(--ac);
  color: #FFF;
}
.section-action.amber:hover { background: var(--ac-dark); color: #FFF; }

.g2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; }
.g3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  padding: 24px;
  margin-bottom: 20px;
  border-radius: 22px;
  color: #FFF7ED;
  background: radial-gradient(circle at 90% 10%, rgba(251,191,36,.25), transparent 34%), linear-gradient(135deg, #292524, #57534E);
  box-shadow: 0 14px 30px rgba(41,37,36,.2);
}
.hero h1 { color: #FFF7ED; margin-bottom: 4px; }
.hero p { color: #D6D3D1; margin: 0; }
.hero .btn { background: #F59E0B; color: #1C1917; }
.domain-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.domain-tool { border: 1px solid var(--bd); border-radius: 16px; padding: 16px; background: var(--card); transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
.domain-tool:hover { transform: translateY(-4px); border-color: var(--ac); box-shadow: var(--sh-hover); }
.domain-tool h3 { margin-bottom: 5px; font-size: 15px; }
.domain-tool p { margin: 0; color: var(--mu); font-size: 13px; }
.tool-row { display: flex; gap: 8px; margin-top: 12px; }
.tool-row input { min-width: 0; width: 100%; border: 1px solid var(--bd); border-radius: 9px; padding: 8px; font: inherit; }
.tool-row input:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px rgba(217,119,6,.14); }
.domain-tech { --ac: #2563EB; --ac-dark: #1D4ED8; --cream: #DBEAFE; }
.domain-tech .hero { background: radial-gradient(circle at 90% 10%, rgba(96,165,250,.3), transparent 34%), linear-gradient(135deg, #172554, #1E3A8A); }
.domain-accounting { --ac: #059669; --ac-dark: #047857; --cream: #D1FAE5; }
.domain-accounting .hero { background: radial-gradient(circle at 90% 10%, rgba(52,211,153,.3), transparent 34%), linear-gradient(135deg, #064E3B, #065F46); }
.domain-rural { --ac: #65A30D; --ac-dark: #4D7C0F; --cream: #ECFCCB; }
.domain-rural .hero { background: radial-gradient(circle at 90% 10%, rgba(163,230,53,.3), transparent 34%), linear-gradient(135deg, #365314, #3F6212); }
.metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.metric { padding: 15px 16px; border: 1px solid var(--bd); border-radius: 16px; background: rgba(250,248,245,.75); }
.metric strong { display: block; font-size: 24px; line-height: 1.1; }
.metric span { color: var(--mu); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
@media(max-width: 780px) {
  .g2 { grid-template-columns: 1fr; }
  .pg { padding: 18px; }
  .hd { padding: 12px 16px; }
  .sb { position: fixed; left: 0; top: 0; transform: translateX(0); box-shadow: 12px 0 30px rgba(0,0,0,.2); }
  .sb.c { width: 240px; transform: translateX(-100%); }
  .sb.c .lb { display: inline; }
  .top-title { min-width: 0; }
  .top-title small { display: none; }
  .top-actions { gap: 6px; }
  .top-actions .pill { display: none; }
  .top-actions .btn { padding: 9px 11px; font-size: 0; }
  .top-actions .btn::first-letter { font-size: 16px; }
  .hero { align-items: flex-start; flex-direction: column; }
  .metric-grid { grid-template-columns: 1fr; }
  .domain-tools { grid-template-columns: 1fr; }
}

/* Buttons — Hover Scale & Color Shift */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--tx);
  color: var(--bg);
  border: 0;
  border-radius: 12px;
  padding: 10px 18px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 6px 16px rgba(38, 34, 31, 0.25);
}
.btn.ghost { background: var(--cream); color: var(--tx); }
.btn.ghost:hover { background: #DDD3C1; }
.btn.amber { background: var(--ac); color: #FFF; }
.btn.amber:hover { background: var(--ac-dark); box-shadow: 0 6px 18px rgba(217, 119, 6, 0.35); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* Pills & Badges Hover */
.pill {
  display: inline-block;
  background: var(--cream);
  color: var(--tx);
  border-radius: 99px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s ease;
}
.pill:hover { transform: scale(1.05); background: #DCD2C0; }
.pill.dark { background: #342E2B; color: #FDE68A; }
.pill.dark:hover { background: #443C38; color: #FFF; }

/* Action Plan Items — HOVER SLIDE & HIGHLIGHT EFFECT */
.ti {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 16px;
  background: #FFF;
  border: 1px solid var(--bd);
  border-radius: 14px;
  margin-top: 8px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.ti:hover {
  transform: translateX(6px);
  background: #FFF8EE;
  border-color: var(--ac);
  box-shadow: 0 4px 12px rgba(217, 119, 6, 0.12);
}
.ti.dn { opacity: 0.55; text-decoration: line-through; background: rgba(231, 223, 211, 0.4); }
.ti.dn:hover { transform: translateX(4px); opacity: 0.8; }
.ti small { margin-left: auto; color: var(--mu); font-weight: 600; }

.bar { height: 10px; background: var(--cream); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.bar i { display: block; height: 100%; background: var(--ac); border-radius: 99px; transition: width 0.4s ease; }

/* Quiz Options — Hover Glow */
.opt {
  display: block;
  width: 100%;
  text-align: left;
  background: #FFF;
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 11px 14px;
  margin-top: 8px;
  font: inherit;
  color: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
}
.opt:hover {
  background: #FFFDF9;
  border-color: var(--ac);
  transform: translateX(4px);
  box-shadow: 0 3px 10px rgba(0,0,0,0.05);
}
.opt.ok { background: rgba(46, 125, 50, 0.15); border-color: var(--ok); font-weight: 600; }
.opt.no { background: rgba(185, 28, 28, 0.15); border-color: #B91C1C; }

/* Onboarding Modal Overlay */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(28, 25, 23, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 50;
}
.md {
  background: var(--card);
  border-radius: 24px;
  padding: 28px;
  width: 100%;
  max-width: 580px;
  max-height: 90vh;
  overflow: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  border: 1px solid var(--bd);
}
.chat-md {
  max-width: 760px;
  padding: 0;
  overflow: hidden;
  background: #171717;
  color: #F5F5F5;
  border: 1px solid #333;
  box-shadow: 0 28px 80px rgba(0,0,0,.45);
}
.chat-head { display:flex; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid #303030; }
.chat-avatar { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; background:linear-gradient(135deg,#2563EB,#7C3AED); font-size:18px; }
.chat-head strong { display:block; font-size:15px; }
.chat-head small { color:#A3A3A3; }
.chat-close { margin-left:auto; border:0; color:#A3A3A3; background:transparent; font-size:20px; cursor:pointer; transition:color .2s, transform .2s; }
.chat-close:hover { color:#FFF; transform:rotate(90deg); }
.chat-body { min-height:330px; max-height:52vh; overflow:auto; padding:28px 24px 14px; }
.chat-welcome { text-align:center; padding:8px 0 20px; }
.chat-welcome h2 { color:#FFF; margin-bottom:8px; }
.chat-welcome p { color:#A3A3A3; max-width:540px; margin:0 auto; }
.chat-msg { display:flex; gap:10px; margin:14px 0; animation:chatIn .22s ease-out; }
.chat-msg.user { justify-content:flex-end; }
.chat-bubble { max-width:78%; padding:11px 14px; border-radius:16px 16px 16px 4px; background:#292929; color:#E5E5E5; white-space:pre-wrap; }
.chat-msg.user .chat-bubble { border-radius:16px 16px 4px 16px; background:#2563EB; color:#FFF; }
.chat-input-wrap { margin:8px 18px 18px; padding:8px 10px 8px 16px; display:flex; align-items:flex-end; gap:8px; border:1px solid #3A3A3A; border-radius:18px; background:#242424; transition:border-color .2s, box-shadow .2s; }
.chat-input-wrap:focus-within { border-color:#666; box-shadow:0 0 0 3px rgba(96,165,250,.14); }
.chat-input { flex:1; min-height:28px; max-height:100px; resize:none; margin:0; padding:5px 0; border:0; outline:0; background:transparent; color:#FFF; }
.chat-input::placeholder { color:#999; }
.chat-icon { width:32px; height:32px; display:grid; place-items:center; border:0; border-radius:50%; background:transparent; color:#A3A3A3; cursor:pointer; transition:background .2s, color .2s, transform .2s; }
.chat-icon:hover { background:#3A3A3A; color:#FFF; transform:translateY(-1px); }
.chat-send { background:#2563EB; color:#FFF; }
.chat-send:hover { background:#3B82F6; }
.chat-status { min-height:18px; padding:0 22px 10px; color:#A3A3A3; font-size:12px; }
.assistant-launcher { position: fixed; right: 24px; bottom: 24px; z-index: 25; width: 56px; height: 56px; border: 0; border-radius: 50%; background: linear-gradient(135deg,#2563EB,#7C3AED); color: #FFF; font-size: 22px; cursor: pointer; box-shadow: 0 12px 28px rgba(37,99,235,.35); transition: transform .22s ease, box-shadow .22s ease; }
.assistant-launcher:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 16px 34px rgba(37,99,235,.45); }
.assistant-pop { position: fixed; right: 24px; bottom: 92px; z-index: 30; width: min(390px, calc(100vw - 32px)); border-radius: 20px; overflow: hidden; background: #171717; color: #F5F5F5; border: 1px solid #333; box-shadow: 0 24px 60px rgba(0,0,0,.35); animation:chatIn .2s ease-out; }
.assistant-pop .chat-body { min-height: 180px; max-height: 42vh; padding: 18px; }
.assistant-pop .chat-welcome { padding: 12px 0 8px; }
.assistant-pop .chat-welcome h2 { font-size: 17px; }
.assistant-pop .chat-welcome p { font-size: 13px; }
.assistant-pop .chat-input-wrap { margin: 8px 12px 12px; }
@media(max-width:560px) { .assistant-launcher { right: 16px; bottom: 16px; } .assistant-pop { right: 16px; bottom: 84px; } }
@keyframes chatIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
@media(max-width:560px) { .chat-body { min-height:300px; padding:22px 16px 10px; } .chat-bubble { max-width:88%; } }
.chat-bubble.ai { white-space: normal; line-height: 1.6; }
.chat-bubble.ai h1, .chat-bubble.ai h2, .chat-bubble.ai h3 { color:#FFF; margin:0 0 8px; }
.chat-bubble.ai p { margin:7px 0; }
.chat-bubble.ai ul, .chat-bubble.ai ol { margin:7px 0 7px 20px; padding:0; }
.chat-bubble.ai li { margin:4px 0; }
.chat-bubble.ai code { background:#111827; color:#E5E7EB; padding:2px 5px; border-radius:5px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:.92em; }
.chat-code { position:relative; margin:10px 0; padding:14px; border-radius:10px; background:#0B1020; border:1px solid #29334D; overflow:auto; }
.chat-code pre { margin:0; white-space:pre; color:#E5E7EB; font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
.chat-copy { position:absolute; top:7px; right:7px; border:1px solid #475569; border-radius:7px; padding:4px 8px; background:#111827; color:#CBD5E1; cursor:pointer; font-size:11px; }
.chat-copy:hover { background:#1F2937; color:#FFF; }
.chat-typing { opacity:.75; font-style:italic; }
.chat-bubble.user { white-space:pre-wrap; }

textarea {
  width: 100%;
  min-height: 160px;
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 14px;
  font: inherit;
  background: #FFF;
  color: inherit;
  resize: vertical;
  margin: 10px 0 14px;
  transition: border-color 0.2s;
}
textarea:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15); }
.intake-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { color: var(--mu); font-size: 12px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
.field input, .field select {
  width: 100%;
  border: 1px solid var(--bd);
  border-radius: 11px;
  padding: 10px 12px;
  font: inherit;
  color: inherit;
  background: #FFF;
  transition: border-color .2s, box-shadow .2s, transform .2s;
}
.field input:hover, .field select:hover { border-color: var(--ac); transform: translateY(-1px); }
.field input:focus, .field select:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px rgba(217,119,6,.15); }
.intake-note { padding: 10px 12px; border-radius: 11px; background: #FFF8EE; color: var(--mu); font-size: 13px; }
@media(max-width: 560px) { .intake-grid { grid-template-columns: 1fr; } .field.full { grid-column: auto; } }

.bd { text-align: center; }
.bd.lk { opacity: 0.4; filter: grayscale(1); }
.bd b { font-size: 36px; display: block; margin-bottom: 4px; }

.wk { display: flex; gap: 10px; align-items: flex-end; height: 130px; margin-top: 10px; }
.wk div { flex: 1; text-align: center; font-size: 12px; color: var(--mu); }
.wk i { display: block; background: var(--ac); border-radius: 6px 6px 0 0; min-height: 4px; margin-bottom: 6px; transition: height 0.3s; }

.st { font-size: 32px; font-weight: 800; color: var(--tx); }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: var(--mu); text-transform: uppercase; margin: 16px 0 8px; }

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #1C1917;
  color: #F5F5F4;
  padding: 12px 24px;
  border-radius: 99px;
  font-weight: 600;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  z-index: 60;
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
const $ = s => document.querySelector(s);
const K = 'guruagent_v5';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fresh = () => ({
  p: null,
  tasks: [], res: [], qs: [], ans: {}, act: {}, log: [], badges: [], n: 0,
  chat: { messages: [] },
  ui: { sb: 1, hide: 0 },
  streak: { cur: 0, best: 0, last: 0, day: '' }
});

let S;
try { S = JSON.parse(localStorage.getItem(K)); } catch(e){}
S = S || fresh();
if (!S.chat || !Array.isArray(S.chat.messages)) S.chat = { messages: [] };
S.chat.messages = S.chat.messages.filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string').slice(-24);
let openedThisLoad = false;

const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch(e){} };
const today = () => new Date().toLocaleDateString('en-CA');
const addDays = (date, amount) => {
  const d = new Date(date + 'T12:00:00');
  d.setDate(d.getDate() + amount);
  return d.toLocaleDateString('en-CA');
};
const done = () => S.tasks.filter(t => t.done).length;
const pct = () => S.tasks.length ? Math.round(done() * 100 / S.tasks.length) : 0;
const subjectMatchers = {
  python: /\bpython\b/i, js: /javascript|\bjs\b/i, react: /\breact\b/i,
  dsa: /\bdsa\b|data structure|algorithm/i, node: /node\.?js|\bnode\b/i,
  html: /\bhtml\b|\bcss\b/i, maths: /\bmaths?\b|algebra|geometry|calculus|trigonometry|quadratic/i,
  accounting: /accounting|ledger|journal|balance sheet|commerce/i
};
const detectSubject = text => Object.keys(subjectMatchers).find(key => subjectMatchers[key].test(text));

function carryForwardTasks() {
  if (!S.p || !Array.isArray(S.tasks) || !S.tasks.length) return;
  const now = today();

function inferInput(text, current) {

  const hours = text.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)/i);
  return {
    ...current,
    name: name ? name[1].trim() : current.name,
    stream: subject || current.stream || '',
    syllabus: text,
    goal: subject ? subject + (urgent ? ' exam preparation' : ' preparation') : text,
    weak: text,
    daily: hours ? hours[1] : current.daily || 'Focused study',
    duration: urgent ? '1 day' : current.duration || 'Focused topic',
    urgent: urgent ? text : '',
    focusText: subject ? text : ''
  };
}

function apply(o, text, upd) {

  ['name','education','stream','year','syllabus','goal','level','daily','duration'].forEach(k => { if (o[k]) p[k] = o[k]; });
  if (o.urgent) p.urgent = o.urgent;
  ['skills','weak'].forEach(k => {
    if (!Array.isArray(o[k])) return;
    p[k] = upd ? [...new Set(o[k])] : [...new Set([...(p[k] || []), ...o[k]])];
  });
  const ids = o.resources.map(r => {
    const id = 'r' + (++S.n);
    S.res.push({ id, title: String(r.title), desc: String(r.desc || ''), tag: r.tag || '', notes: Array.isArray(r.notes) ? r.notes : [] });

  });

    const rd = t.type !== 'quiz' && ids.length;
    S.tasks.push({ title: String(t.title), type: rd ? 'read' : 'quiz', res: rd ? ids[t.res] || ids[i % ids.length] : 0, target: t.target || 3, pr: 0, done: 0, due: addDays(today(), S.tasks.length) });
  });
  S.tasks.forEach((t, i) => { if (!t.due) t.due = addDays(today(), i); });
  o.questions.filter(q => q && Array.isArray(q.opts) && q.opts.length > 1 && q.opts[q.a] != null).forEach(q => S.qs.push({ q: String(q.q), o: q.opts, a: q.a }));
  if (!S.qs.length) Q.gen.forEach(q => S.qs.push({ q: q[0], o: q[1], a: q[2] }));
}

function formatInline(text) {
  return esc(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')

    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

function formatAi(raw) {
  const text = String(raw || '').replace(/\r/g, '');
  const parts = text.split(/```([\w#+.-]*)\n?([\s\S]*?)```/g);
  let html = '';
  for (let i = 0; i < parts.length; i += 3) {
    const prose = parts[i] || '';
    if (prose) {
      const lines = prose.split('\n');
      let list = null;
      for (const line of lines) {
        const t = line.trim();
        if (!t) { if (list) { html += `</${list}>`; list = null; } continue; }
        const h = t.match(/^###\s+(.+)$/) || t.match(/^##\s+(.+)$/) || t.match(/^#\s+(.+)$/);
        if (h) { if (list) { html += `</${list}>`; list = null; } html += `<h3>${formatInline(h[1])}</h3>`; continue; }
        const li = t.match(/^[-*]\s+(.+)$/) || t.match(/^\d+[.)]\s+(.+)$/);
        if (li) { const ordered = /^\d+[.)]/.test(t); const tag = ordered ? 'ol' : 'ul'; if (list !== tag) { if (list) html += `</${list}>`; html += `<${tag}>`; list = tag; } html += `<li>${formatInline(li[1])}</li>`; continue; }
        if (list) { html += `</${list}>`; list = null; }
        html += `<p>${formatInline(t)}</p>`;
      }
      if (list) html += `</${list}>`;
    }
    if (i + 1 < parts.length) {
      const lang = parts[i + 1] || '';
      const code = parts[i + 2] || '';
      const safe = esc(code.trimEnd());
      html += `<div class="chat-code"><button class="chat-copy" type="button" data-copy="${esc(code.trimEnd())}">Copy</button><pre>${safe}</pre></div>`;
    }
  }
  return html || '<p>Sorry, I could not generate a response.</p>';
}

    ['syllabus', 'Tell me your syllabus or the subjects you want to study.'],
    ['goal', 'What do you want to achieve with this dashboard?'],
    ['weak', 'Which topics are difficult, and how should I help you?'],
    ['daily', 'How many hours can you study daily?'],
    ['duration', 'In how much time do you want to reach this goal?']
  ];
  let index = fields.findIndex(f => !data[f[0]]); if (index < 0) index = 0;
  const messages = [];
  const addMessage = (who, text, raw=false) => {
    const content = who === 'ai' && raw ? formatAi(text) : esc(text);
    messages.push(`<div class="chat-msg ${who}"><div class="chat-bubble ${who === 'ai' ? 'ai' : 'user'}">${content}</div></div>`);
  };
  const renderHistory = () => {
    const history = (S.chat?.messages || []).map(m => `<div class="chat-msg ${m.role === 'user' ? 'user' : 'ai'}"><div class="chat-bubble ${m.role === 'user' ? 'user' : 'ai'}">${m.role === 'assistant' ? formatAi(m.content) : esc(m.content)}</div></div>`).join('');
    return history || '<div class="chat-welcome"><h2>What can I help you with?</h2><p>Ask me maths, coding, science, exam questions, concepts, examples, or anything you are learning.</p></div>';
  };
  const isAssistant = !!floating && !!S.p;
  $('#modal').innerHTML = `<div class="${floating ? 'assistant-pop' : 'ov'}"><div class="md chat-md">
    <div class="chat-head"><div class="chat-avatar">✦</div><div><strong>GuruAgent</strong><small>Personal learning assistant</small></div><button class="chat-close" data-act="chat-close" aria-label="Close">×</button></div>
    <div class="chat-body" id="chat-body">${isAssistant ? renderHistory() : ''}</div>
    <div class="chat-status" id="chat-status"></div>
    <form class="chat-input-wrap" id="chat-form"><button class="chat-icon" type="button" title="Add context">＋</button><textarea class="chat-input" id="chat-input" rows="1" placeholder="Ask anything"></textarea><button class="chat-icon" type="button" title="Voice input">♩</button><button class="chat-icon chat-send" type="submit" title="Send">➤</button></form>
  </div></div>`;
  const body = $('#chat-body'), input = $('#chat-input');
  const required = ['name','education','stream','year','syllabus','goal','weak','daily','duration'];
  const complete = () => required.every(k => String(data[k] || '').trim());
  const explicitPlanRequest = text => /\b(update|change|create|make|build|generate|dashboard|study plan|plan bana|plan banao)\b/i.test(text);
  const nextQuestion = () => { index = fields.findIndex(f => !String(data[f[0]] || '').trim()); if (index >= 0) addMessage('ai', fields[index][1]); };

  if (!isAssistant && !S.p) nextQuestion();

  $('#chat-form').onsubmit = async e => {
    e.preventDefault();
    const text = input.value.trim(); if (!text) return;
    input.value = '';
    if (isAssistant) {
      S.chat.messages.push({ role:'user', content:text });
      S.chat.messages = S.chat.messages.slice(-24); save();
      body.innerHTML = renderHistory() + '<div class="chat-msg ai"><div class="chat-bubble ai chat-typing">✦ Thinking…</div></div>';
      body.scrollTop = body.scrollHeight;
      $('#chat-status').textContent = '✦ GuruAgent is thinking…';
      try {
        const reply = await askLocalAi(text, true);
        S.chat.messages.push({ role:'assistant', content:reply });
        S.chat.messages = S.chat.messages.slice(-24); save();
        body.innerHTML = renderHistory();
      } catch (error) {
        console.error(error);
        const msg = String(error?.message || '');
        const reply = /not configured|GROQ_API_KEY/i.test(msg)
          ? 'AI backend configured nahi hai. Vercel Environment Variables me GROQ_API_KEY check karke redeploy karo.'
          : `AI service se response nahi aa raha. ${msg || 'Vercel /api/chat deployment aur API configuration check karo.'}`;
        body.innerHTML = renderHistory() + `<div class="chat-msg ai"><div class="chat-bubble ai">${esc(reply)}</div></div>`;
      }
      $('#chat-status').textContent = '';
      body.scrollTop = body.scrollHeight;
      return;
    }

    addMessage('user', text);
    const updateRequest = explicitPlanRequest(text);
    if (S.p && !updateRequest) {
      $('#chat-status').textContent = '✦ GuruAgent is thinking…';
      try { addMessage('ai', await askLocalAi(text), true); }
      catch (error) { console.error(error); addMessage('ai', String(error?.message || 'AI service temporarily unavailable.')); }
      body.innerHTML = messages.join(''); $('#chat-status').textContent = ''; body.scrollTop = body.scrollHeight; return;
    }
    const focusedRequest = /\b(kal|tomorrow|urgent|exam|paper|test|aaj|today|parso|study plan|plan bana|plan banao|live study plan)\b/i.test(text);
    if (detectSubject(text) && (updateRequest || !S.p || focusedRequest)) {
      addMessage('ai', 'Understood. I will use the details you gave me and prepare a focused dashboard.', false);
      body.innerHTML = messages.join('');
      setTimeout(() => buildFocused(text), 120);
      return;
    }
    const key = index >= 0 ? fields[index][0] : 'extra'; if (key !== 'extra') data[key] = text;
    if (complete()) {
      addMessage('ai', 'I have understood your profile, syllabus and goal. I am preparing your custom dashboard now…');
      body.innerHTML = '<div class="chat-welcome"><h2>Building your dashboard…</h2><p>Understanding your stream, subjects and study needs.</p></div>' + messages.join('');
      $('#chat-status').textContent = '✦ Personalizing your learning workspace…';
      setTimeout(() => { const o=local(data); apply(o,Object.values(data).join(' | '),upd); S.streak.last=Date.now(); $('#modal').innerHTML=''; location.hash='#/dashboard'; chk(); save(); render(); }, 650); return;
    }
    nextQuestion(); body.innerHTML = '<div class="chat-welcome"><h2>Let’s build your learning workspace</h2><p>Tell me the next detail.</p></div>' + messages.join(''); body.scrollTop=body.scrollHeight;
  };
  input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#chat-form').requestSubmit(); } };
  body.addEventListener('click', e => { const b=e.target.closest('[data-copy]'); if (!b) return; navigator.clipboard?.writeText(b.getAttribute('data-copy') || '').then(()=>{b.textContent='Copied'; setTimeout(()=>b.textContent='Copy',1200);}).catch(()=>{}); });
  input.focus();
}


let rt;
function reader(id) {
  const r = S.res.find(x => x.id === id);
  if (!r) return;
  const t = S.tasks.find(t => t.type === 'read' && t.res === id);
  const dn = t && t.done;
  let s = 0;
  $('#modal').innerHTML = `<div class="ov"><div class="md"><span class="pill">${esc(r.tag || 'Guide')}</span><h2 style="margin-top:10px">${esc(r.title)}</h2><p class="mu">${esc(r.desc)}</p><ul>${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul><div class="bar"><i id="rb" style="width:${dn ? 100 : 0}%"></i></div><p class="mu" id="rs">${dn ? '✓ Completed' : 'Reading… progress tracked automatically'}</p><button class="btn ghost" data-act="close">Close</button></div></div>`;
  clearInterval(rt);
  if (dn) return;
  rt = setInterval(() => {
    if (document.hidden) return;
    s++;
    const a = S.act[today()] = S.act[today()] || { n: 0, s: 0 };
    a.s++;
    if ($('#rb')) $('#rb').style.width = (s * 100 / 8) + '%';
    if (s >= 8) {
      clearInterval(rt);
      if ($('#rs')) $('#rs').textContent = '✓ Completed! Action plan updated.';
      ev('read', id);
    }
  }, 1000);
}

const ti = t => `<div class="ti ${t.done ? 'dn' : ''}" data-go="${t.type === 'read' ? 'res:' + t.res : '#/practice'}"><span>${t.done ? '✓' : '○'}</span><span style="font-weight:600">${esc(t.title)}${t.carry && t.carry.length ? '<br><small style="font-weight:500">Merged catch-up task</small>' : ''}</span>${t.due ? `<small>${t.due === today() ? 'Today' : new Date(t.due + 'T12:00:00').toLocaleDateString('en', { month: 'short', day: 'numeric' })}${t.type === 'quiz' && !t.done ? ' · ' + t.pr + '/' + t.target : ''}</small>` : ''}</div>`;

const plan = max => {
  const P = S.tasks.filter(t => !t.done);
  const D = S.ui.hide ? [] : S.tasks.filter(t => t.done);
  return `<div class="lbl">Personalized Study Plan · ${esc(S.p.goal || 'Your goal')}</div><p class="mu" style="font-size:13px">Tasks are generated from your ${esc(S.p.year || 'current')} syllabus and carried forward when unfinished.</p><div class="lbl">Pending Tasks (Top Priority)</div>${(max ? P.slice(0, max) : P).map(ti).join('') || '<p class="mu">🎉 All tasks done!</p>'}${D.length ? '<div class="lbl">Completed Tasks (Bottom)</div>' + (max ? D.slice(0, Math.max(2, max - P.length)) : D).map(ti).join('') : ''}`;
};

const qc = i => {
  const q = S.qs[i], a = S.ans[i];
  return `<div style="margin:14px 0"><b>Q${i + 1}. ${esc(q.q)}</b>${q.o.map((o, j) => `<button class="opt ${a == null ? '' : j === q.a ? 'ok' : j === a ? 'no' : ''}" data-a="${i}:${j}">${esc(o)}</button>`).join('')}</div>`;
};

const rc = (r, o) => {
  const t = S.tasks.find(t => t.type === 'read' && t.res === r.id);
  return `<div class="card ${o ? 'k' : ''}" ${o ? `data-go="res:${r.id}"` : ''} style="margin:0"><span class="pill">${esc(r.tag || 'Guide')}</span><h3 style="margin-top:10px">${esc(r.title)}</h3><p class="mu">${esc(r.desc)}</p><b>${t && t.done ? '✓ Completed' : 'Open Resource →'}</b></div>`;
};

const bg = all => B.filter(b => all || S.badges.includes(b[0])).map(b => {
  const u = S.badges.includes(b[0]);
  return `<div class="card bd ${u ? '' : 'lk'}" style="margin:0"><b>${b[1]}</b><h3>${b[2]}</h3><span class="mu">${b[3]}</span></div>`;
}).join('') || '<p class="mu">No badges unlocked yet.</p>';

const V = {
  dashboard() {
    const h = new Date().getHours();
    const g = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
    const n = S.p.name;
    const d = domainInfo();
    return `
      <section class="hero">
        <div><p class="lbl" style="color:#FCD34D; margin:0 0 6px;">${d.icon} ${d.label}</p><h1>${d.title}</h1><p>Good ${g}${n ? ', ' + esc(n) : ''}. ${d.sub}</p></div>
        <button class="btn" data-act="update">✦ Refresh my plan</button>
      </section>
      ${domainTools()}
      <div class="metric-grid">
        <div class="metric"><span>Tasks left</span><strong>${Math.max(0, S.tasks.length - done())}</strong></div>
        <div class="metric"><span>Questions solved</span><strong>${Object.keys(S.ans).length}</strong></div>
        <div class="metric"><span>Study time</span><strong>${Math.round(Object.values(S.act).reduce((sum, a) => sum + a.s, 0) / 60)}m</strong></div>
      </div>

      <div class="card k" data-go="#/achievements" style="margin-top:16px; background: linear-gradient(135deg, #FAF8F5 0%, #E7DFD3 100%); border-color:#DDD5C7;">
        <h3>🏆 YOUR ACHIEVEMENTS</h3>
        <div style="display:flex; gap:36px; flex-wrap:wrap; margin: 12px 0;">
          <div><span class="st">🔥 ${S.streak.cur}</span><div class="mu">Day Streak</div></div>
          <div><span class="st">⭐ ${pct()}%</span><div class="mu">Completed</div></div>
          <div><span class="st">🏅 ${S.badges.length}</span><div class="mu">Badges</div></div>
        </div>
        <p class="mu" style="margin:0; font-weight:600;">Track your milestones and keep your momentum going.</p>
        <a class="section-action amber" href="#/achievements">View Achievements & Streak Badges →</a>
      </div>

      <div class="g2">
        <div class="card">
          <h3>ACTION PLAN</h3>
          ${plan(6)}
          <a class="section-action" href="#/tasks">See all tasks in detail →</a>
        </div>
        <div class="card k" data-go="#/progress">
          <h3>DAILY PROGRESS</h3>
          <div class="st" style="font-size:48px; color:var(--ac);">${pct()}%</div>
          <div class="bar"><i style="width:${pct()}%"></i></div>
          <p style="font-weight:600">${done()} / ${S.tasks.length} tasks completed</p>
          <p class="mu">Your daily momentum at a glance.</p>
          <a class="section-action" href="#/progress">View Full Detailed Progress →</a>
        </div>
      </div>

      <div class="card">
        <h3>🧠 KNOWLEDGE DRILL</h3>
        ${S.qs.slice(0, 2).map((q, i) => qc(i)).join('')}
        <div style="margin-top:18px; padding-top:12px; border-top:1px solid var(--bd); display:flex; justify-content:space-between; align-items:center;">
          <span class="mu">Want to solve more questions?</span>
          <a class="section-action amber" href="#/practice">Go to Practice Page →</a>
        </div>
      </div>

      <div class="card k" data-go="#/resources">
        <h3>📚 RECOMMENDED FOR YOU</h3>
        <div class="g3" style="margin-top:12px">${S.res.slice(0, 3).map(r => rc(r, 0)).join('')}</div>
        <a class="section-action" href="#/resources">Open full Resource Library →</a>
      </div>
    `;
  },
  progress() {
    const tm = Math.round(Object.values(S.act).reduce((s, a) => s + a.s, 0) / 60);
    const days = [...Array(7)].map((_, i) => {
      const d = new Date(Date.now() - (6 - i) * 864e5);
      return [d.toLocaleDateString('en-CA'), d.toLocaleDateString('en', { weekday: 'short' })];
    });
    const cnt = d => (S.act[d] || { n: 0 }).n;
    const mx = Math.max(1, ...days.map(d => cnt(d[0])));
    return `
      <h1>Progress Deep Dive</h1>
      <div class="g3">${[['Total Tasks', S.tasks.length], ['Completed', done()], ['Pending', S.tasks.length - done()], ['Active Time', tm + ' min'], ['Current Streak', '🔥 ' + S.streak.cur], ['Best Streak', S.streak.best + ' days']].map(x => `<div class="card" style="margin:0"><div class="mu">${x[0]}</div><div class="st">${x[1]}</div></div>`).join('')}</div>
      <div class="card" style="margin-top:20px"><h3>Overall Goal Progress: ${pct()}%</h3><div class="bar"><i style="width:${pct()}%"></i></div></div>
      <div class="card"><h3>Weekly Activity Tracker</h3><div class="wk">${days.map(d => `<div><i style="height:${cnt(d[0]) * 95 / mx}px"></i>${d[1]}</div>`).join('')}</div></div>
      <div class="g2"><div class="card"><h3>Completed Topics</h3>${S.tasks.filter(t => t.done).map(t => `<div class="ti" style="cursor:default">✓ ${esc(t.title)}</div>`).join('') || '<p class="mu">No completed topics yet.</p>'}</div>
      <div class="card"><h3>Goal Details</h3><p><b>${esc(S.p.goal || '—')}</b></p><p class="mu">${esc(S.p.level || '')} ${S.p.daily ? '· ' + esc(S.p.daily) : ''} ${S.p.duration ? '· ' + esc(S.p.duration) : ''}</p><h3>Activity Log</h3>${S.log.slice(0, 8).map(l => `<div class="mu" style="font-size:12px">${new Date(l.t).toLocaleTimeString()} ·${esc(l.m)}</div>`).join('') || '<p class="mu">No logs recorded.</p>'}</div></div>
    `;
  },
  tasks() { return `<h1>All Action Plan Tasks</h1><div class="card"><button class="btn ghost" data-act="hide">${S.ui.hide ? 'Show' : 'Hide'} completed tasks</button>${plan()}</div>`; },
  practice() { return `<h1>Knowledge Drill Practice</h1><p class="mu">${Object.keys(S.ans).length} of ${S.qs.length} answered.</p><div class="card">${S.qs.map((q, i) => qc(i)).join('')}</div>`; },
  resources() { return `<h1>Resource Library</h1><div class="g3">${S.res.map(r => rc(r, 1)).join('')}</div>`; },
  achievements() { return `<h1>Achievements & Streaks</h1><div class="card"><h3>🔥 ${S.streak.cur}-Day Current Streak</h3><p class="mu">Best Streak: ${S.streak.best} days. Keep visiting and practicing daily to retain your streak.</p></div><div class="g3">${bg(1)}</div>`; },
  profile() {
    const p = S.p;
    return `
      <h1>User Profile</h1>
      <div class="card">
        <div style="display:flex; gap:16px; align-items:center;">
          <span class="pill dark" style="font-size:24px; padding:10px 18px;">${esc((p.name || 'G')[0].toUpperCase())}</span>
          <div><h2 style="margin:0">${esc(p.name || 'Learner')}</h2><span class="mu">${esc(p.goal || '')}</span></div>
        </div>
        <p style="margin-top:14px"><b>Education:</b> ${esc(p.education || '—')} | <b>Stream:</b> ${esc(p.stream || '—')} | <b>Year:</b> ${esc(p.year || '—')}</p>
        <p><b>Level:</b> ${esc(p.level || '—')} | <b>Daily Time:</b> ${esc(p.daily || '—')} | <b>Duration:</b> ${esc(p.duration || '—')}</p>
        <p class="mu"><b>Syllabus:</b> ${esc(p.syllabus || '—')}</p>
        <p>${[...(p.skills || []), ...(p.weak || [])].map(s => `<span class="pill">${esc(s)}</span> `).join('')}</p>
      </div>
      <div class="card"><h3>My Badges</h3><div class="g3">${bg(0)}</div></div>
      <button class="btn ghost" data-act="reset" style="color:#B91C1C;">Reset All Data</button>
    `;
  }
};

const NAV = [
  ['dashboard', '🏠', 'Dashboard'],
  ['progress', '📊', 'Progress'],
  ['tasks', '✓', 'Tasks'],
  ['practice', '🧠', 'Practice'],
  ['resources', '📚', 'Resources'],
  ['achievements', '🏆', 'Achievements'],
  ['profile', '👤', 'Profile']
];

const route = () => { const r = location.hash.slice(2); return NAV.some(n => n[0] === r) ? r : 'dashboard'; };

function render() {
  const showOnLoad = !openedThisLoad;
  openedThisLoad = true;
  if (!S.p) {
    $('#app').innerHTML = '';
    if (!$('#chat-input')) ask();
    return;
  }
  const r = route();
  $('#app').innerHTML = `
    <aside class="sb ${S.ui.sb ? '' : 'c'}">
      <div class="logo"><span>🎓</span><span class="lb">GuruAgent</span></div>
      ${NAV.map(n => `<a class="nv ${r === n[0] ? 'on' : ''}" href="#/${n[0]}" title="${n[2]}"><span>${n[1]}</span><span class="lb">${n[2]}</span></a>`).join('')}
      <div style="flex:1"></div>
      <div class="nv" data-act="toggle"><span>${S.ui.sb ? '←' : '→'}</span><span class="lb">Collapse</span></div>
    </aside>
    <main class="mn domain-${domainKey()}">
      <header class="hd">
        <button class="btn ghost" data-act="toggle" style="background:#342E2B; color:#FFF;">☰</button>
        <div class="top-title"><b style="font-size:18px">GuruAgent</b><small>PERSONAL LEARNING OS</small></div>
        <div class="top-actions"><button class="btn amber" data-act="update">✦ Update My Plan</button><span class="pill dark">🔥 ${S.streak.cur} Day Streak</span><a class="pill dark" href="#/profile">👤 Profile</a></div>
      </header>
      <div class="pg">${V[r]()}</div>
    </main>
    <button class="assistant-launcher" data-act="assistant" aria-label="Open GuruAgent assistant" title="Ask GuruAgent">✦</button>
  `;
  if (showOnLoad && !$('#chat-input')) ask(true);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-a],[data-act]');
  if (!el) return;

  if (el.dataset.a) {
    const [i, j] = el.dataset.a.split(':').map(Number);
    if (S.ans[i] == null) {
      S.ans[i] = j;
      log('Answered a question');
      ev('ans');
    }
    return;
  }
  if (el.dataset.act) {
    const a = el.dataset.act;
    if (a === 'toggle') { S.ui.sb = S.ui.sb ? 0 : 1; save(); render(); }
    else if (a === 'update') ask(1);
    else if (a === 'assistant') ask(false, true);
    else if (a === 'calculate') calculateProfit();
    else if (a === 'chat-close' && S.p) { $('#modal').innerHTML = ''; save(); }
    else if (a === 'hide') { S.ui.hide = S.ui.hide ? 0 : 1; save(); render(); }
    else if (a === 'close') { clearInterval(rt); $('#modal').innerHTML = ''; save(); }
    else if (a === 'reset' && confirm('Reset all data and start over?')) { S = fresh(); save(); location.hash = '#/dashboard'; render(); }
    return;
  }
  if (e.target.closest('a')) return;
  const g = el.dataset.go;
  if (g.startsWith('res:')) reader(g.slice(4));
  else location.hash = g;
});

addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
